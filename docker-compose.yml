services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
      POSTGRES_DB: restaurant_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U restaurant -d restaurant_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaurant:restaurant@postgres:5432/restaurant_db?schema=public
      JWT_SECRET: restaurant-jwt-secret-change-in-production
      JWT_EXPIRES_IN: 8h
      PORT: 3000
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  postgres_data:
